<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/logo/belmonda-coffe-logo.jpg.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Belmonde Hotel & Restaurant in Mogadishu. Accommodation, dining, weddings, meetings, and a digital menu."
    />
    <title>BELMONDE HOTEL & RESTAURANT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var storedTheme = localStorage.getItem('restaurant-theme')
        if (storedTheme === 'dark' || storedTheme === 'light') {
          document.documentElement.dataset.theme = storedTheme
        }
        var storedLanguage = localStorage.getItem('restaurant-language')
        if (storedLanguage === 'en' || storedLanguage === 'so') {
          document.documentElement.lang = storedLanguage
        }
      } catch (error) {
        /* Storage can be blocked. React applies the defaults. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
